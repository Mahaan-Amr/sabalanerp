name: Design-system browser acceptance

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/design-system-e2e-preflight.mjs"
      - "scripts/run-design-system-e2e.mjs"
      - "tests/design-system-e2e/**"
      - "playwright.design-system.config.ts"
      - "docker-compose.local.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/design-system-e2e.yml"
  workflow_dispatch:

jobs:
  browser-acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # This runner owns the approved, long-running sabalanerp-local Compose project.
    runs-on: [self-hosted, sabalanerp-local]
    environment: design-system-e2e
    timeout-minutes: 60
    concurrency:
      group: sabalanerp-local-design-system-browser
      cancel-in-progress: false
    env:
      SABALAN_BROWSER_BUILD_ID: erp_ci_${{ github.sha }}
      DESIGN_SYSTEM_E2E_ADMIN_USERNAME: ${{ secrets.DESIGN_SYSTEM_E2E_ADMIN_USERNAME }}
      DESIGN_SYSTEM_E2E_ADMIN_PASSWORD: ${{ secrets.DESIGN_SYSTEM_E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare browser fixture dependencies
        run: |
          npm ci --prefix packages/contract-product-graph
          npm run build:contract-product-graph
          npm ci --prefix packages/partner-sales-contracts
          npm run build:partner-sales-contracts
          npm ci --prefix backend
          npm --prefix backend run db:generate
          npm ci --prefix frontend
      - name: Ensure Chrome is available
        run: |
          if node --input-type=module -e "import { chromium } from '@playwright/test'; const browser = await chromium.launch({ channel: 'chrome' }); await browser.close();"; then
            echo "Using the installed Chrome browser"
          else
            npx playwright install chrome
          fi
      - run: npm run docker:local:ps
      - run: npm run docker:local:acceptance:build
      - run: npm run docker:local:ps
      - run: npm run docker:local:acceptance:up
      - run: npm run test:design-system:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: design-system-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/design-system/
            test-results/design-system-report/
          retention-days: 14
