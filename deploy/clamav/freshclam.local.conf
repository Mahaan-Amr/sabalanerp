DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
# Local-only C3SL/UFPR mirror of publisher-signed official CVD/CDIFF databases.
# Preserve updater state and schedule; no fallback to another acquisition origin.
DatabaseMirror https://clamavdb.c3sl.ufpr.br
DNSDatabaseInfo current.cvd.clamav.net
ScriptedUpdates yes
TestDatabases yes
NotifyClamd /etc/clamav/clamd.conf
ConnectTimeout 30
ReceiveTimeout 60
MaxAttempts 3
