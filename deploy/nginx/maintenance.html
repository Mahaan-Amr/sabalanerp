<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>به‌روزرسانی سبلان ERP</title>
  <style>
    :root { color-scheme: light dark; font-family: Tahoma, Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f1ea; color: #26231f; }
    main { width: min(34rem, calc(100% - 3rem)); padding: 2.5rem; border: 1px solid #d8d1c4; border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem rgba(38,35,31,.08); text-align: center; }
    h1 { margin: 0 0 1rem; font-size: 1.5rem; }
    p { margin: 0; line-height: 2; }
    @media (prefers-color-scheme: dark) { body { background: #181715; color: #f4f1ea; } main { background: #24221f; border-color: #47423b; } }
  </style>
</head>
<body>
  <main>
    <h1>سامانه در حال به‌روزرسانی است</h1>
    <p>برای حفاظت از اطلاعات، ثبت و مشاهده اطلاعات برای چند دقیقه متوقف شده است. لطفاً کمی بعد دوباره تلاش کنید.</p>
  </main>
</body>
</html>
