user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Authenticated Accounting pages can be the referer for ordinary assets.
  map $http_referer $access_referer {
    default $http_referer;
    "~*^(https?://[^/?#]+)?/+(api/+(accounting|dispatch-confirmation)|dashboard/+accounting|files/+accounting-contracts)([/?#]|$)" "[accounting]";
    "~*^(https?://[^/?#]+)?/[^?#]*%" "[encoded-path]";
  }

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$access_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  # An escaped or normalized path may differ from the original request. Keep
  # those Accounting requests out of the combined log as well.
  map $uri $accounting_normalized_route {
    default "";
    ~*^/api/accounting(/|$) /api/accounting/:path;
    ~*^/api/dispatch-confirmation(/|$) /api/dispatch-confirmation/:path;
    ~*^/dashboard/accounting(/|$) /dashboard/accounting/:path;
    ~*^/files/accounting-contracts(/|$) /files/accounting-contracts/:path;
  }

  # Keep the original Accounting route label after a maintenance redirect.
  # Never emit the path itself, arguments or headers.
  map $request_uri $accounting_route {
    default $accounting_normalized_route;
    ~*^/api/accounting/dashboard(/(change|workspace))?/?(\?|$) /api/accounting/dashboard;
    ~*^/api/accounting/financial-trend/?(\?|$) /api/accounting/financial-trend;
    ~*^/api/accounting/receivables/?(\?|$) /api/accounting/receivables;
    ~*^/api/accounting/payments/?(\?|$) /api/accounting/payments;
    ~*^/api/accounting/contracts/?(\?|$) /api/accounting/contracts;
    ~*^/api/accounting/contracts/ /api/accounting/contracts/:path;
    ~*^/api/accounting/dispatch-candidates/?(\?|$) /api/accounting/dispatch-candidates;
    ~*^/api/accounting/dispatch-candidates/[^/?]+/decision/?(\?|$) /api/accounting/dispatch-candidates/:id/decision;
    ~*^/api/accounting/dispatch-candidates/[^/?]+/document-read-model/?(\?|$) /api/accounting/dispatch-candidates/:id/document-read-model;
    ~*^/api/accounting/dispatch-candidates/ /api/accounting/dispatch-candidates/:path;
    ~*^/api/accounting/dispatch-waybills(/|\?|$) /api/accounting/dispatch-waybills/:path;
    ~*^/api/accounting/loadings/[^/?]+/sepidar-reference/?(\?|$) /api/accounting/loadings/:id/sepidar-reference;
    ~*^/api/dispatch-confirmation(/|\?|$) /api/dispatch-confirmation/:path;
    ~*^/api/accounting(/|\?|$) /api/accounting/:path;
    ~*^/dashboard/accounting/?(\?|$) /dashboard/accounting;
    ~*^/dashboard/accounting/contracts/?(\?|$) /dashboard/accounting/contracts;
    ~*^/dashboard/accounting/(dispatch|dispatch-documents)/?(\?|$) /dashboard/accounting/dispatch;
    ~*^/dashboard/accounting/ /dashboard/accounting/:path;
    ~*^/files/accounting-contracts(/|\?|$) /files/accounting-contracts/:path;
  }

  map $accounting_route $other_access {
    "" 1;
    default 0;
  }

  map $upstream_http_x_accounting_request_id $accounting_request_id {
    "~^[a-f0-9-]{36}$" $upstream_http_x_accounting_request_id;
    default $request_id;
  }

  map $upstream_http_x_accounting_commit $accounting_commit {
    "~^[a-f0-9]{40}$" $upstream_http_x_accounting_commit;
    local local;
    default unattested;
  }

  map $status $accounting_http_outcome {
    499 client_abort;
    502 upstream_unavailable;
    503 unavailable;
    504 upstream_timeout;
    ~^4 rejected;
    ~^5 internal_error;
    default success;
  }

  map "$status:$upstream_http_x_accounting_outcome" $accounting_outcome {
    ~^499: client_abort;
    "~^[25][0-9]{2}:(contention|pool_timeout|transaction_expired|internal_error)$" $1;
    default $accounting_http_outcome;
  }

  log_format accounting escape=json
    '{"kind":"accounting_edge_request","at":"$time_iso8601","route":"$accounting_route",'
    '"requestId":"$accounting_request_id","commit":"$accounting_commit",'
    '"durationSeconds":"$request_time","upstreamSeconds":"$upstream_response_time",'
    '"status":$status,"outcome":"$accounting_outcome","responseBodyBytes":$body_bytes_sent}';

  access_log /var/log/nginx/access.log main if=$other_access;
  access_log /var/log/nginx/access.log accounting if=$accounting_route;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_names_hash_bucket_size 128;
  server_tokens off;

  include /etc/nginx/conf.d/*.conf;
}
