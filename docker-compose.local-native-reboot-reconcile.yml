# One-shot incident-only command for the existing sabalanerp-local backend.
# Apply only after an independently reviewed local data checkpoint and host
# verification of image ID, boot IDs, exact ACTIVE SHA and loopback ingress.
name: sabalanerp-local
services:
  backend:
    image: ${LOCAL_NATIVE_REBOOT_IMAGE_ID:?immutable image ID required}
    command: ["sh", "scripts/with-backend-control-ownership.sh", "--reconcile-local-reboot"]
    restart: "no"
