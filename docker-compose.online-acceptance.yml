# Extra application slot inside the existing project; no extra database or stack.
name: sabalanerp-local
services:
  frontend-candidate:
    extends:
      file: ${ONLINE_ACCEPTANCE_BASE_COMPOSE:-docker-compose.local.yml}
      service: frontend
    profiles: [online-acceptance]
    image: ${ONLINE_ACCEPTANCE_FRONTEND_IMAGE:?Set the verified existing frontend image identity}
    command: [node, node_modules/next/dist/bin/next, start, -p, "3000"]
    ports: !override
      - "127.0.0.1:3101:3000"
    environment:
      NODE_ENV: production
      NEXT_DIST_DIR: .next-build
      SABALAN_BROWSER_BUILD_ID: ${ONLINE_ACCEPTANCE_BROWSER_BUILD_ID:?Set the compiled browser identity}
      BACKEND_API_ORIGIN: http://backend:5000
    volumes:
      - type: bind
        source: ${ONLINE_ACCEPTANCE_FRONTEND_DIST:?Set the absolute reviewed compiled frontend directory}
        target: /app/.next-build
        read_only: true
      - type: bind
        source: ${ONLINE_ACCEPTANCE_SOURCE_ROOT:?Set the absolute reviewed source directory}/frontend/next.config.js
        target: /app/next.config.js
        read_only: true
      - type: bind
        source: ${ONLINE_ACCEPTANCE_SOURCE_ROOT}/frontend/browser-build-identity.cjs
        target: /app/browser-build-identity.cjs
        read_only: true
      - type: bind
        source: ${ONLINE_ACCEPTANCE_SOURCE_ROOT}/frontend/public
        target: /app/public
        read_only: true
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1
  backend-candidate:
    extends:
      file: ${ONLINE_ACCEPTANCE_BASE_COMPOSE:-docker-compose.local.yml}
      service: backend
    profiles: [online-acceptance]
    image: ${ONLINE_ACCEPTANCE_BACKEND_IMAGE:-sabalanerp-local-backend}
    command: [node, dist/index.js]
    ports: !override
      - "127.0.0.1:5100:5000"
    environment:
      BACKEND_RUNTIME_ROLE: candidate
      DATABASE_URL: postgresql://postgres:${LOCAL_POSTGRES_PASSWORD:-sabalanerp-local-only}@postgres:5432/${LOCAL_POSTGRES_DATABASE:-sabalanerp}?schema=public&connection_limit=2&pool_timeout=10&application_name=sabalanerp-online-candidate
    volumes:
      - type: bind
        source: ${ONLINE_ACCEPTANCE_SOURCE_ROOT:?Set the absolute reviewed source directory}/backend/dist
        target: /app/dist
        read_only: true
      - type: bind
        source: ${ONLINE_ACCEPTANCE_SOURCE_ROOT}/packages/partner-sales-contracts/dist
        target: /packages/partner-sales-contracts/dist
        read_only: true
      - type: bind
        source: ${ONLINE_ACCEPTANCE_SOURCE_ROOT}/packages/contract-product-graph/dist
        target: /packages/contract-product-graph/dist
        read_only: true
      - ${LOCAL_BACKEND_STORAGE_CONTRACTS_SOURCE:-backend_storage_contracts}:/app/storage/contracts:ro
      - ${LOCAL_BACKEND_STORAGE_HR_SOURCE:-backend_storage_hr_hiring}:/app/storage/hr-hiring:ro
      - ${LOCAL_BACKEND_STORAGE_ACCOUNTING_SOURCE:-backend_storage_accounting_contracts}:/app/storage/accounting-contracts:ro
      - ${LOCAL_BACKEND_STORAGE_SUPPORT_SOURCE:-backend_storage_support_tickets}:/app/storage/support-tickets:ro
      - ${LOCAL_BACKEND_UPLOADS_SOURCE:-backend_uploads}:/app/uploads:ro
      - ${LOCAL_BACKEND_RECOVERY_SOURCE:-backend_recovery}:/app/storage/recovery:ro
      - ${LOCAL_BACKEND_SEPIDAR_BACKUP_SOURCE:-backend_storage_sepidar_backups}:/app/storage/sepidar-backups:ro
      - ${LOCAL_RECOVERY_COORDINATION_SOURCE:-recovery_coordination}:/app/recovery-coordination:ro
      - ${LOCAL_INQUIRY_RECOVERY_SOURCE:-inquiry_data}:/app/recovery-sources/inquiry:ro
      - online_runtime_acceptance:/app/online-runtime-acceptance
    read_only: true
    tmpfs: [/tmp]
    stop_grace_period: 5m
    mem_limit: 1280m
    memswap_limit: 1536m
    cpus: 1
  backend-retained:
    mem_limit: 768m
    memswap_limit: 1536m
    extends:
      service: backend-candidate
    profiles: [online-acceptance]
    ports: !override
      - "127.0.0.1:5101:5000"

volumes:
  # Linux-native private fixture state shared only by the two diagnostic slots.
  # This is neither business storage nor a second database/Compose project.
  online_runtime_acceptance:
