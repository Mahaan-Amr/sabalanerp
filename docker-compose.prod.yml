services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app_network
    profiles:
      - optional

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav_database:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 5m
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ALL_PROXY: ${ALL_PROXY:-}
        all_proxy: ${all_proxy:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      SMS_IR_API_KEY: ${SMS_IR_API_KEY}
      SMS_IR_API_URL: ${SMS_IR_API_URL}
      SMS_IR_TEMPLATE_ID: ${SMS_IR_TEMPLATE_ID}
      SMS_IR_CONTRACT_CONFIRM_TEMPLATE_ID: ${SMS_IR_CONTRACT_CONFIRM_TEMPLATE_ID}
      SMS_IR_HIRING_INVITATION_TEMPLATE_ID: ${SMS_IR_HIRING_INVITATION_TEMPLATE_ID}
      SMS_IR_HIRING_INVITATION_TEMPLATE_PARAMETERS: ${SMS_IR_HIRING_INVITATION_TEMPLATE_PARAMETERS}
      SMS_IR_HIRING_CORRECTION_TEMPLATE_ID: ${SMS_IR_HIRING_CORRECTION_TEMPLATE_ID:-763918}
      SMS_IR_HIRING_OFFER_TEMPLATE_ID: ${SMS_IR_HIRING_OFFER_TEMPLATE_ID:-894291}
      SMS_IR_ENVIRONMENT: ${SMS_IR_ENVIRONMENT}
      SMS_IR_DISPATCH_CONFIRM_OTP_TEMPLATE_ID: ${SMS_IR_DISPATCH_CONFIRM_OTP_TEMPLATE_ID:-173656}
      SMS_IR_DISPATCH_EXIT_TEMPLATE_ID: ${SMS_IR_DISPATCH_EXIT_TEMPLATE_ID:-153829}
      SMS_IR_DISPATCH_EXIT_MANUAL_RETRY_TEMPLATE_ID: ${SMS_IR_DISPATCH_EXIT_MANUAL_RETRY_TEMPLATE_ID:-3429496}
      BIOMETRIC_TEMPLATE_KEY_BASE64: ${BIOMETRIC_TEMPLATE_KEY_BASE64}
      DISPATCH_CONFIRMATION_OTP_SECRET: ${DISPATCH_CONFIRMATION_OTP_SECRET}
      BIOMETRIC_LEGAL_READY: ${BIOMETRIC_LEGAL_READY:-false}
      SMS_IR_TIMEOUT_MS: ${SMS_IR_TIMEOUT_MS:-30000}
      SMS_IR_DNS_SERVERS: ${SMS_IR_DNS_SERVERS:-}
      CONTRACT_CONFIRM_LINK_TTL_DAYS: ${CONTRACT_CONFIRM_LINK_TTL_DAYS}
      CONTRACT_CONFIRM_OTP_TTL_MINUTES: ${CONTRACT_CONFIRM_OTP_TTL_MINUTES}
      CONTRACT_CONFIRM_MAX_ATTEMPTS: ${CONTRACT_CONFIRM_MAX_ATTEMPTS}
      CONTRACT_CONFIRM_RESEND_COOLDOWN_SECONDS: ${CONTRACT_CONFIRM_RESEND_COOLDOWN_SECONDS}
      CONTRACT_PRODUCT_GRAPH_READ_ONLY: ${CONTRACT_PRODUCT_GRAPH_READ_ONLY:-false}
      VERIFICATION_CODE_EXPIRY_MINUTES: ${VERIFICATION_CODE_EXPIRY_MINUTES}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      HR_HIRING_ANTIVIRUS_COMMAND: /app/scripts/hr-clamdscan.sh
      ALLOW_UNSCANNED_HR_FILES: "false"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      RECOVERY_STORAGE_DIR: /app/storage/recovery
      RECOVERY_COORDINATION_DIR: /app/recovery-coordination
      INQUIRY_RECOVERY_SOURCE_DIR: /app/recovery-sources/inquiry
      INQUIRY_RECOVERY_COORDINATED: "true"
      ALLOW_SANITIZED_RECOVERY: "false"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_COMMIT: ${APP_COMMIT:-unknown}
      HR_REDESIGN_CUTOVER_ENABLED: ${HR_REDESIGN_CUTOVER_ENABLED:-false}
      HR_REDESIGN_CUTOVER_ACCEPTANCE_PATH: ${HR_REDESIGN_CUTOVER_ACCEPTANCE_PATH:-}
      HR_REDESIGN_CUTOVER_REVISION: ${HR_REDESIGN_CUTOVER_REVISION:-}
    volumes:
      - backend_storage_contracts:/app/storage/contracts
      - backend_storage_hr_hiring:/app/storage/hr-hiring
      - backend_storage_accounting_contracts:/app/storage/accounting-contracts
      - backend_storage_support_tickets:/app/storage/support-tickets
      - backend_uploads:/app/uploads
      - backend_recovery:/app/storage/recovery
      - recovery_coordination:/app/recovery-coordination
      - inquiry_data:/app/recovery-sources/inquiry
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5000/api/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
      interval: 15s
      timeout: 8s
      retries: 8
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        ALL_PROXY: ${ALL_PROXY:-}
        all_proxy: ${all_proxy:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1));\""]
      interval: 15s
      timeout: 8s
      retries: 8
    networks:
      - app_network

  inquiry:
    build:
      context: .
      dockerfile: deploy/docker/inquiry.Dockerfile
      network: host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${INQUIRY_DATABASE_URL}
      ADMIN_EMAIL: ${INQUIRY_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${INQUIRY_ADMIN_PASSWORD}
      SESSION_SECRET: ${INQUIRY_SESSION_SECRET}
      RECOVERY_COORDINATION_DIR: /app/recovery-coordination
    volumes:
      - inquiry_data:/data
      - recovery_coordination:/app/recovery-coordination
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1));\""]
      interval: 15s
      timeout: 8s
      retries: 8
    networks:
      - app_network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      INQUIRY_DOMAIN: ${INQUIRY_DOMAIN}
    command: /bin/sh -c "envsubst '$$DOMAIN $$INQUIRY_DOMAIN' < /etc/nginx/conf.d/app.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      inquiry:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/app.conf.template:/etc/nginx/conf.d/app.conf.template:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 8s
      retries: 8
    networks:
      - app_network

  certbot:
    image: certbot/certbot:latest
    profiles:
      - tools
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  backend_storage_contracts:
  backend_storage_hr_hiring:
  backend_storage_accounting_contracts:
  backend_storage_support_tickets:
  backend_uploads:
  backend_recovery:
  recovery_coordination:
  inquiry_data:
  certbot_www:
  certbot_conf:
  clamav_database:

networks:
  app_network:
    driver: bridge
