# Scanner-free protected QA graph for the combined allocation release.
services:
  postgres:
    extends:
      file: docker-compose.prod.yml
      service: postgres
  backend:
    extends:
      file: docker-compose.prod.yml
      service: backend
    # The sealed QA plan may deliberately fail only the candidate's readiness
    # check for the separate rollback rehearsal. Empty values preserve the
    # real /api/ready check; the retained old image never matches the target.
    environment:
      QA_REHEARSAL_FAIL_BACKEND_COMMIT: ${QA_REHEARSAL_FAIL_BACKEND_COMMIT:-}
      QA_REHEARSAL_FAIL_BACKEND_SOURCE_HASH: ${QA_REHEARSAL_FAIL_BACKEND_SOURCE_HASH:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const e=process.env;const c=e.QA_REHEARSAL_FAIL_BACKEND_COMMIT||'';const h=e.QA_REHEARSAL_FAIL_BACKEND_SOURCE_HASH||'';const armed=c.length===40&&h.length===64&&!/[^a-f0-9]/.test(c+h);if(armed&&e.APP_COMMIT===c&&e.PERFORMANCE_RELEASE_SOURCE_HASH===h)process.exit(51);require('http').get({hostname:'127.0.0.1',port:Number(e.PORT)||5000,path:'/api/ready'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
      interval: 15s
      timeout: 8s
      retries: 8
  deployment:
    extends:
      file: docker-compose.prod.yml
      service: deployment
    environment:
      SABALAN_BACKUP_TARGET: qa
      SABALAN_QA_PLAN_SHA256: ${DEPLOYMENT_QA_REHEARSAL_PLAN_SHA256:?QA plan hash required}
  frontend:
    extends:
      file: docker-compose.prod.yml
      service: frontend
  inquiry:
    extends:
      file: docker-compose.prod.yml
      service: inquiry
  nginx:
    extends:
      file: docker-compose.prod.yml
      service: nginx
    # Docker does not publish loopback ports from an internal-only bridge.
    # This bridge exists only inside the named QA network namespace; disable
    # masquerading so Nginx gains loopback ingress without external egress.
    networks:
      - app_network
      - qa_ingress

volumes:
  postgres_data:
  backend_storage_contracts:
  backend_storage_hr_hiring:
  backend_storage_accounting_contracts:
  backend_storage_dispatch_documents:
  backend_storage_support_tickets:
  backend_storage_performance_exports:
  backend_uploads:
  backend_recovery:
  recovery_coordination:
  inquiry_data:
  certbot_www:
  certbot_conf:

networks:
  app_network:
    driver: bridge
    internal: true
  qa_ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
