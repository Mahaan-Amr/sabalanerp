# Opt-in #432 rehearsal graph. The six service definitions remain inherited
# from the protected production graph; only the QA network boundary differs.
# The protected controller must select this file from a reviewed QA-only plan.
services:
  postgres:
    extends:
      file: docker-compose.prod.yml
      service: postgres
  clamav:
    extends:
      file: docker-compose.prod.yml
      service: clamav
    # The native QA daemon has no default bridge/host-gateway address. ClamAV
    # gets its updater route from the separate private-namespace egress bridge.
    extra_hosts: !reset []
    networks:
      - app_network
      - clamav_egress
  backend:
    extends:
      file: docker-compose.prod.yml
      service: backend
  deployment:
    extends:
      file: docker-compose.prod.yml
      service: deployment
    environment:
      SABALAN_BACKUP_TARGET: qa
      SABALAN_QA_PLAN_SHA256: ${DEPLOYMENT_QA_REHEARSAL_PLAN_SHA256:?QA plan hash required}
  frontend:
    extends:
      file: docker-compose.prod.yml
      service: frontend
  inquiry:
    extends:
      file: docker-compose.prod.yml
      service: inquiry
  nginx:
    extends:
      file: docker-compose.prod.yml
      service: nginx
    # Docker does not publish loopback ports from an internal-only bridge.
    # This bridge exists only inside the named QA network namespace; disable
    # masquerading so Nginx gains loopback ingress without external egress.
    networks:
      - app_network
      - qa_ingress

volumes:
  postgres_data:
  backend_storage_contracts:
  backend_storage_hr_hiring:
  backend_storage_accounting_contracts:
  backend_storage_dispatch_documents:
  backend_storage_support_tickets:
  backend_storage_performance_exports:
  backend_uploads:
  backend_recovery:
  recovery_coordination:
  inquiry_data:
  certbot_www:
  certbot_conf:
  clamav_database:

networks:
  app_network:
    driver: bridge
    internal: true
  clamav_egress:
    driver: bridge
  qa_ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
