# Explicit opt-in diagnostic services in the existing project. No database,
# canonical-service override, production endpoint or business storage mount.
name: sabalanerp-local
services:
  frontend-online-old:
    profiles: [retained-ui-acceptance]
    image: ${RETAINED_UI_OLD_IMAGE:?Set the measured immutable diagnostic image}
    pull_policy: never
    ports: ["127.0.0.1:3102:3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 1m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend-online-new:
    extends: {service: frontend-online-old}
    image: ${RETAINED_UI_NEW_IMAGE:?Set the measured immutable diagnostic image}
    ports: !override ["127.0.0.1:3103:3000"]
  frontend-online-proxy:
    profiles: [retained-ui-acceptance]
    image: ${RETAINED_UI_PROXY_IMAGE:?Set the existing measured backend image}
    pull_policy: never
    command: [node, /fixture/tests/online-deployment/retained-ui-proxy.worker.mjs]
    environment:
      RETAINED_UI_FIXTURE_ROOT: ${RETAINED_UI_FIXTURE_ROOT:?Set the operation-specific private Linux fixture root}
      RETAINED_UI_CONFIGURATION_SHA256: ${RETAINED_UI_CONFIGURATION_SHA256:?Set the frozen fixture configuration hash}
    volumes:
      - type: bind
        source: ${RETAINED_UI_SOURCE_ROOT:?Set the reviewed worktree source}
        target: /fixture
        read_only: true
      - online_runtime_acceptance:/app/online-runtime-acceptance
    ports: ["127.0.0.1:3104:3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    stop_grace_period: 1m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/',{headers:{host:'127.0.0.1:3104'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  online_runtime_acceptance:
