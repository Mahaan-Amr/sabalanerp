  <main><div class="page"><header class="page-head"><div><div class="eyebrow">کانال فروشنده همکار</div><h1>استعلام قیمت و ساخت قرارداد</h1><p>پیکربندی محصول، دریافت قیمت عمده و ورود مستقیم به Wizard قرارداد مشتری</p></div><div class="actions"><button class="btn soft"><svg><use href="#file"/></svg> پرونده‌های من</button><button class="btn primary"><svg><use href="#plus"/></svg> استعلام جدید</button></div></header><nav class="modes"><button class="mode active" data-mode="partial">پاسخ جزئی</button><button class="mode" data-mode="expiring">نزدیک انقضا</button><button class="mode" data-mode="wizard">آماده Wizard</button><button class="mode" data-mode="loss">فروش با زیان</button></nav><div id="root"></div></div></main>

  <div class="switcher"><button class="switch-btn" id="prev"><svg style="transform:rotate(180deg)"><use href="#arrow"/></svg></button><div class="switch-label">طرح <strong id="variantName"></strong></div><button class="switch-btn" id="next"><svg><use href="#arrow"/></svg></button></div>
  <script>
    const variants=[{key:'A',name:'Wizard متمرکز'},{key:'B',name:'Master / Detail'},{key:'C',name:'برد مسیر فروش'}];
    const base=[{id:1,name:'تراورتن عباس‌آباد',config:'طولی · عرض ۴۰ · ضخامت ۲ · سابیده',swatch:'travertine',wholesale:'۱٬۸۵۰٬۰۰۰',retail:'۲٬۲۷۰٬۰۰۰',status:'approved'},{id:2,name:'مرمریت دهبید',config:'اسلب · ضخامت ۲ · پولیش · ممتاز',swatch:'marble',wholesale:'—',retail:'—',status:'pending'},{id:3,name:'پله چینی',config:'۱۱۰×۳۵ · ضخامت ۳ · چرمی',swatch:'stair',wholesale:'—',retail:'—',status:'rejected'}];
    let mode='partial';
    const icon=n=>`<svg><use href="#${n}"/></svg>`;
    const current=()=>{const k=new URLSearchParams(location.search).get('variant')?.toUpperCase();return variants.find(v=>v.key===k)||variants[0]};
    const products=()=>base.map(p=>mode==='wizard'?{...p,status:'approved',wholesale:p.id===1?p.wholesale:p.id===2?'۲٬۴۲۰٬۰۰۰':'۳٬۱۹۰٬۰۰۰',retail:p.id===1?p.retail:p.id===2?'۲٬۸۹۰٬۰۰۰':'۳٬۶۵۰٬۰۰۰'}:mode==='loss'&&p.id===1?{...p,retail:'۱٬۶۰۰٬۰۰۰'}:p);
    const meta=s=>({approved:['مصوب','success'],pending:['در انتظار پاسخ','warning'],rejected:['استعلام مجدد','danger']}[s]);
    const metrics=()=>{const n=products().filter(p=>p.status==='approved').length;return `<section class="metrics"><article class="surface metric"><div class="metric-top">ردیف‌های استعلام<span class="metric-icon">${icon('file')}</span></div><div class="metric-value">۳</div><div class="metric-note">INQ-140506</div></article><article class="surface metric"><div class="metric-top">قیمت معتبر<span class="metric-icon">${icon('check')}</span></div><div class="metric-value">${n} از ۳</div><div class="metric-note">اعتبار ۴۸ ساعته</div></article><article class="surface metric"><div class="metric-top">جمع قرارداد مشتری<span class="metric-icon">${icon('chart')}</span></div><div class="metric-value money">${n===3?'۸۶٬۴۰۰٬۰۰۰':n===1?'۲۲٬۷۰۰٬۰۰۰':'—'}</div><div class="metric-note">تومان · قابل ویرایش</div></article><article class="surface metric"><div class="metric-top">آمادگی پرونده<span class="metric-icon">${icon('box')}</span></div><div class="metric-value">${n===3?'کامل':'جزئی'}</div><div class="metric-note">فقط ردیف‌های مصوب</div></article></section>`};
    const alertBox=()=>mode==='expiring'?`<div class="alert warning">${icon('clock')}<div><strong>۵ ساعت تا پایان اعتبار قیمت</strong><br>اگر Final Submit انجام نشود، داده‌ها حفظ و استعلام مجدد پیشنهاد می‌شود.</div></div>`:mode==='loss'?`<div class="alert danger">${icon('chart')}<div><strong>قیمت مشتری ۲۵۰٬۰۰۰ تومان کمتر از قیمت عمده است.</strong><br>فروش زیان‌ده است؛ ثبت قرارداد مسدود نمی‌شود.</div></div>`:mode==='wizard'?`<div class="alert info">${icon('check')}<div><strong>هر سه ردیف آماده Wizard هستند.</strong><br>قیمت retail از عمده پیش‌فرض گرفته و قابل ویرایش است.</div></div>`:`<div class="alert warning">${icon('clock')}<div><strong>پاسخ استعلام جزئی است.</strong><br>با ردیف مصوب ادامه دهید؛ دو ردیف دیگر در استعلام می‌مانند.</div></div>`;
    const row=p=>{const [label,tone]=meta(p.status),loss=mode==='loss'&&p.id===1;return `<article class="product"><div class="product-main"><span class="swatch ${p.swatch}"></span><div class="product-copy"><strong>${p.name}</strong><small>${p.config}</small></div></div><div><div class="label">قیمت عمده واحد</div><div class="value money">${p.wholesale}${p.wholesale==='—'?'':' تومان'}</div></div><div><div class="label">قیمت مشتری</div><div class="value money" style="color:${loss?'var(--danger)':'inherit'}">${p.retail}${p.retail==='—'?'':' تومان'}</div></div><div class="row-actions"><span class="badge ${tone}"><span class="dot"></span>${label}</span><button class="btn soft" aria-label="عملیات">${icon('more')}<span>عملیات</span></button></div></article>`};
    const summary=()=>{const n=products().filter(p=>p.status==='approved').length;return `<aside class="aside"><section class="surface"><div class="surface-head"><div><h2>آمادگی قرارداد</h2><p>پرونده دوسندی اتمیک</p></div><span class="badge ${n===3?'success':'warning'}">${n===3?'آماده':'جزئی'}</span></div><div class="surface-body summary"><div><div class="summary-row"><span>پیشرفت ردیف‌ها</span><strong>${n} از ۳</strong></div><div class="progress" style="margin-top:8px"><span style="width:${n/3*100}%"></span></div></div><div class="summary-row"><span>مشتری</span><strong>شرکت آرتا سازه</strong></div><div class="summary-row"><span>قیمت retail</span><strong>${n} ردیف</strong></div><div class="divider"></div>${mode==='loss'?'<div class="alert danger">حاشیه ردیف اول منفی است.</div>':''}<button class="btn soft">ذخیره و خروج</button></div></section></aside>`};
    const contractDock=()=>{const n=products().filter(p=>p.status==='approved').length;return `<div class="dock"><div><strong>${n} محصول برای قرارداد</strong><div style="color:var(--muted);font-size:11px">قیمت retail پیش از ثبت قابل تغییر است</div></div><button class="btn primary">${icon('arrow')} ساخت پرونده و ورود به Wizard</button></div>`};
    const variantA=()=>`${metrics()}<div class="stepper surface"><div class="step"><span class="step-num">۱</span>مشتری</div><div class="step active"><span class="step-num">۲</span>محصول و قیمت</div><div class="step"><span class="step-num">۳</span>تحویل</div><div class="step"><span class="step-num">۴</span>پرداخت</div><div class="step"><span class="step-num">۵</span>تأیید</div></div>${alertBox()}<div class="a-grid" style="margin-top:16px"><section class="surface"><div class="surface-head"><div><h2>محصولات این استعلام</h2><p>هر configuration، قیمت و اعتبار مستقل دارد</p></div><button class="btn soft">${icon('plus')} افزودن محصول</button></div>${products().map(row).join('')}</section>${summary()}</div>${contractDock()}`;
    const variantB=()=>{const p=products()[0],n=products().filter(x=>x.status==='approved').length;return `${metrics()}${alertBox()}<div class="b-grid" style="margin-top:16px"><section class="surface"><div class="surface-head"><div><h2>استعلام‌ها</h2><p>آخرین فعالیت</p></div>${icon('plus')}</div><div class="inquiry-list"><button class="inquiry active"><div class="inq-top"><strong>INQ-140506</strong><span class="badge warning">${n===3?'کامل':'جزئی'}</span></div><p>۳ محصول · آرتا سازه · امروز</p></button><button class="inquiry"><div class="inq-top"><strong>INQ-140492</strong><span class="badge success">کامل</span></div><p>۲ محصول · معماران شرق · دیروز</p></button><button class="inquiry"><div class="inq-top"><strong>INQ-140481</strong><span class="badge neutral">بسته</span></div><p>۵ محصول · شخصی · ۳ روز پیش</p></button></div></section><section class="surface"><div class="surface-head"><div><h2>پیکربندی و قیمت</h2><p>ردیف ۱ از ۳</p></div><span class="badge success">قیمت مصوب</span></div><div class="surface-body"><div class="config-hero"><span class="swatch ${p.swatch}"></span><div><h2>${p.name}</h2><p style="color:var(--muted)">${p.config}</p></div></div><div class="config-grid"><div class="field"><span>نوع محصول</span><strong>سنگ طولی</strong></div><div class="field"><span>عرض</span><strong>۴۰ سانتی‌متر</strong></div><div class="field"><span>ضخامت</span><strong>۲ سانتی‌متر</strong></div><div class="field"><span>معدن</span><strong>عباس‌آباد</strong></div><div class="field"><span>پرداخت سطح</span><strong>سابیده</strong></div><div class="field"><span>مقدار</span><strong>۱۰ مترمربع</strong></div></div><div class="price-box"><div class="price-top"><span>قیمت عمده مصوب</span><strong class="money">۱٬۸۵۰٬۰۰۰ تومان</strong></div><div class="price-input"><span>قیمت فروش مشتری</span><strong class="money" style="color:${mode==='loss'?'var(--danger)':'inherit'}">${mode==='loss'?'۱٬۶۰۰٬۰۰۰':'۲٬۲۷۰٬۰۰۰'} تومان</strong></div>${mode==='loss'?'<small style="color:var(--danger)">زیان واحد: ۲۵۰٬۰۰۰ تومان — ثبت مجاز است</small>':''}</div></div></section><aside class="b-summary"><section class="surface"><div class="surface-head"><div><h2>پرونده قرارداد</h2><p>PSC-140507</p></div><span class="badge purple">Draft</span></div><div class="surface-body summary"><div class="summary-row"><span>مشتری</span><strong>آرتا سازه</strong></div><div class="summary-row"><span>ردیف قابل استفاده</span><strong>${n}</strong></div><div class="summary-row"><span>جمع retail</span><strong class="money">${n===3?'۸۶٬۴۰۰٬۰۰۰':'۲۲٬۷۰۰٬۰۰۰'}</strong></div><div class="divider"></div><button class="btn primary">${icon('arrow')} ورود به Wizard</button></div></section></aside></div>`};
    const card=p=>{const [label,tone]=meta(p.status);return `<article class="board-card"><div class="board-head"><div class="product-main"><span class="swatch ${p.swatch}"></span><div class="product-copy"><strong>${p.name}</strong><small>${p.config}</small></div></div>${icon('more')}</div><span class="badge ${tone}">${label}</span><div class="board-data"><div class="datum"><span>عمده</span><strong class="money">${p.wholesale}</strong></div><div class="datum"><span>مشتری</span><strong class="money">${p.retail}</strong></div></div><button class="btn ${p.status==='rejected'?'warning':'soft'}" style="width:100%" ${p.status==='pending'?'disabled':''}>${icon(p.status==='approved'?'edit':p.status==='rejected'?'refresh':'clock')} ${p.status==='approved'?'تنظیم قیمت مشتری':p.status==='rejected'?'استعلام مجدد':'منتظر پاسخ'}</button></article>`};
    const variantC=()=>{const p=products(),a=p.filter(x=>x.status==='approved'),w=p.filter(x=>x.status==='pending'),r=p.filter(x=>x.status==='rejected');return `${metrics()}${alertBox()}<div class="board" style="margin-top:16px"><section class="lane"><div class="lane-head"><h2>آماده قرارداد</h2><span class="count">${a.length}</span></div>${a.map(card).join('')||'<div class="alert info">ردیفی آماده نیست.</div>'}</section><section class="lane"><div class="lane-head"><h2>در انتظار پاسخ</h2><span class="count">${w.length}</span></div>${w.map(card).join('')||'<div class="alert info">صف خالی است.</div>'}</section><section class="lane"><div class="lane-head"><h2>نیازمند اقدام</h2><span class="count">${r.length}</span></div>${r.map(card).join('')||'<div class="alert info">اقدامی وجود ندارد.</div>'}</section></div>${contractDock()}`};
    function render(){const v=current();document.getElementById('root').innerHTML=v.key==='A'?variantA():v.key==='B'?variantB():variantC();document.getElementById('variantName').textContent=`${v.key} — ${v.name}`;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
    function cycle(d){const v=current(),i=variants.findIndex(x=>x.key===v.key),next=variants[(i+d+variants.length)%variants.length],q=new URLSearchParams(location.search);q.set('variant',next.key);history.replaceState({},'',`${location.pathname}?${q}`);render()}
    document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark');addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
  </script>
</body>
</html>
