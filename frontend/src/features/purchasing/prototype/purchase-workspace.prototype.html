/*
 * Sabalan Design System semantic interface.
 *
 * Callers consume --sds-* meanings and sds-* classes. Raw palette values stay
 * in this adapter so light and dark themes expose the same interface.
 */
:root,
[data-theme="light"] {
  color-scheme: light;
  --sds-surface-canvas: #f6f8f8;
  --sds-surface-panel: #ffffff;
  --sds-surface-subtle: #eef3f3;
  --sds-surface-raised: #ffffff;
  --sds-surface-overlay: rgb(8 20 20 / 58%);
  --sds-text-primary: #102121;
  --sds-text-secondary: #425858;
  --sds-text-muted: #657777;
  --sds-text-inverse: #ffffff;
  --sds-border-subtle: #e2e9e9;
  --sds-border-default: #ccd8d8;
  --sds-border-strong: #9eb1b1;
  --sds-accent: #075757;
  --sds-accent-hover: #064747;
  --sds-accent-soft: #e3f1f0;
  --sds-accent-on-soft: #064747;
  --sds-accent-surface: var(--sds-accent-soft);
  --sds-on-accent: var(--sds-text-inverse);
  --sds-text-on-accent: var(--sds-text-inverse);
  --sds-focus-ring: #087878;
  --sds-success: #087044;
  --sds-success-surface: #e9f7ef;
  --sds-success-border: #a9ddc1;
  --sds-success-soft: var(--sds-success-surface);
  --sds-warning: #8a4b08;
  --sds-warning-surface: #fff4df;
  --sds-warning-border: #f3ce8d;
  --sds-warning-soft: var(--sds-warning-surface);
  --sds-danger: #b42318;
  --sds-danger-surface: #fff0ee;
  --sds-danger-border: #f0b7b1;
  --sds-danger-soft: var(--sds-danger-surface);
  --sds-info: #175cd3;
  --sds-info-surface: #edf4ff;
  --sds-info-border: #b2ccff;
  --sds-purple: #6941c6;
  --sds-purple-surface: #f4f0ff;
  --sds-purple-border: #d5c6fa;
  --sds-artwork-metal-gold-highlight: #fff1bd;
  --sds-artwork-metal-gold-mid: #d6a34f;
  --sds-artwork-metal-gold-shadow: #8b551d;
  --sds-artwork-gem-turquoise: #37d0d7;
  --sds-artwork-gem-teal: #04a4ba;
  --sds-artwork-gem-cyan: #36ceee;
  --sds-artwork-gem-crimson: #bc153c;
  --sds-artwork-gem-scarlet: #ff263c;
  --sds-artwork-gem-champagne: #d1b494;
  --sds-artwork-gem-diamond: #d8e0ec;
  --sds-space-1: 0.25rem;
  --sds-space-2: 0.5rem;
  --sds-space-3: 0.75rem;
  --sds-space-4: 1rem;
  --sds-space-5: 1.25rem;
  --sds-space-6: 1.5rem;
  --sds-space-8: 2rem;
  --sds-radius-control: 0.625rem;
  --sds-radius-card: 0.875rem;
  --sds-radius-dialog: 1rem;
  --sds-radius-lg: var(--sds-radius-dialog);
  --sds-radius-pill: 999px;
  --sds-shadow-card: 0 1px 2px rgb(8 20 20 / 7%);
  --sds-shadow-raised: 0 16px 40px rgb(8 20 20 / 14%);
  --sds-shadow-focus: 0 0 0 3px rgb(8 120 120 / 24%);
  --sds-motion-fast: 120ms;
  --sds-motion-standard: 200ms;
  --sds-motion-slow: 280ms;
  --sds-ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
  --sds-control-height: 2.75rem;
}

[data-theme="dark"] {
  color-scheme: dark;
  --sds-surface-canvas: #081414;
  --sds-surface-panel: #102222;
  --sds-surface-subtle: #162b2b;
  --sds-surface-raised: #193030;
  --sds-surface-overlay: rgb(0 0 0 / 72%);
  --sds-text-primary: #f4f8f8;
  --sds-text-secondary: #c1cece;
  --sds-text-muted: #c1cece;
  --sds-text-inverse: #071313;
  --sds-border-subtle: #203838;
  --sds-border-default: #2d4949;
  --sds-border-strong: #557070;
  --sds-accent: #69c7c2;
  --sds-accent-hover: #8bd8d3;
  --sds-accent-soft: #173d3c;
  --sds-accent-on-soft: #a8e3df;
  --sds-accent-surface: var(--sds-accent-soft);
  --sds-on-accent: var(--sds-text-inverse);
  --sds-text-on-accent: var(--sds-text-inverse);
  --sds-focus-ring: #74d4ce;
  --sds-success: #75d6a6;
  --sds-success-surface: #123b2a;
  --sds-success-border: #286746;
  --sds-success-soft: var(--sds-success-surface);
  --sds-warning: #f5c36b;
  --sds-warning-surface: #443014;
  --sds-warning-border: #765321;
  --sds-warning-soft: var(--sds-warning-surface);
  --sds-danger: #ffaaa0;
  --sds-danger-surface: #481f1d;
  --sds-danger-border: #7f3631;
  --sds-danger-soft: var(--sds-danger-surface);
  --sds-info: #9ec5ff;
  --sds-info-surface: #172d55;
  --sds-info-border: #2f5592;
  --sds-purple: #c3b2ff;
  --sds-purple-surface: #31245a;
  --sds-purple-border: #594692;
  --sds-artwork-metal-gold-highlight: #fff1bd;
  --sds-artwork-metal-gold-mid: #d6a34f;
  --sds-artwork-metal-gold-shadow: #8b551d;
  --sds-artwork-gem-turquoise: #37d0d7;
  --sds-artwork-gem-teal: #04a4ba;
  --sds-artwork-gem-cyan: #36ceee;
  --sds-artwork-gem-crimson: #bc153c;
  --sds-artwork-gem-scarlet: #ff263c;
  --sds-artwork-gem-champagne: #d1b494;
  --sds-artwork-gem-diamond: #d8e0ec;
  --sds-shadow-card: 0 1px 2px rgb(0 0 0 / 24%);
  --sds-shadow-raised: 0 18px 44px rgb(0 0 0 / 42%);
  --sds-shadow-focus: 0 0 0 3px rgb(116 212 206 / 30%);
}

.sds-neumorphic-scope {
  --sds-surface-canvas: #f4f7f8;
  --sds-surface-panel: #f5f8f9;
  --sds-surface-subtle: #e9eef0;
  --sds-surface-raised: #f8fafb;
  --sds-surface-overlay: rgb(30 45 55 / 28%);
  --sds-text-primary: #111820;
  --sds-text-secondary: #5f6b78;
  --sds-text-muted: #7c8996;
  --sds-border-subtle: rgb(70 88 105 / 8%);
  --sds-border-default: rgb(70 88 105 / 12%);
  --sds-accent: #087864;
  --sds-accent-hover: #066553;
  --sds-accent-soft: rgb(24 184 159 / 12%);
  --sds-accent-on-soft: #087864;
  --sds-focus-ring: #0f8f7a;
  --sds-radius-card: 1.125rem;
  --sds-neu-shadow-card: 8px 8px 18px rgb(163 177 190 / 18%), -8px -8px 18px rgb(255 255 255 / 82%);
  --sds-neu-shadow-small: 4px 4px 10px rgb(163 177 190 / 16%), -4px -4px 10px rgb(255 255 255 / 72%);
  --sds-neu-shadow-inset: inset 2px 2px 5px rgb(163 177 190 / 16%), inset -2px -2px 5px rgb(255 255 255 / 62%);
}

[data-theme="dark"] .sds-neumorphic-scope,
[data-theme="dark"].sds-neumorphic-scope {
  --sds-surface-canvas: #101923;
  --sds-surface-panel: #15212c;
  --sds-surface-subtle: #111d27;
  --sds-surface-raised: #182631;
  --sds-surface-overlay: rgb(0 0 0 / 42%);
  --sds-text-primary: #f4f7f8;
  --sds-text-secondary: #b9c2cb;
  --sds-text-muted: #b9c2cb;
  --sds-border-subtle: rgb(255 255 255 / 5%);
  --sds-border-default: rgb(255 255 255 / 8%);
  --sds-border-strong: rgb(255 255 255 / 13%);
  --sds-accent: #31d1b5;
  --sds-accent-hover: #55dcc4;
  --sds-accent-soft: rgb(49 209 181 / 12%);
  --sds-accent-on-soft: #78e2cf;
  --sds-focus-ring: #5ce0c8;
  --sds-neu-shadow-card: 8px 8px 18px rgb(0 0 0 / 24%), -6px -6px 16px rgb(255 255 255 / 2.5%);
  --sds-neu-shadow-small: 4px 4px 10px rgb(0 0 0 / 22%), -3px -3px 9px rgb(255 255 255 / 2%);
  --sds-neu-shadow-inset: inset 2px 2px 5px rgb(0 0 0 / 30%), inset -2px -2px 5px rgb(255 255 255 / 3%);
}

/* Scoped workspace presentation keeps small supporting text readable. */
[data-erp-presentation="workspace"] {
  --sds-text-muted: var(--sds-text-secondary);
}

.sds-neumorphic-card,
.sds-neumorphic-bottom-nav {
  border: 1px solid var(--sds-border-subtle);
  border-radius: var(--sds-radius-card);
  background: var(--sds-surface-raised);
  color: var(--sds-text-primary);
  box-shadow: var(--sds-neu-shadow-card);
}

.sds-neumorphic-bottom-nav a[aria-current="page"] {
  color: var(--sds-text-primary);
}

.sds-neumorphic-icon,
.sds-neumorphic-count {
  border-radius: 0.875rem;
  box-shadow: var(--sds-neu-shadow-small);
}

.sds-notification-count {
  border: 1px solid var(--sds-danger-border);
  background: var(--sds-danger-surface);
  color: var(--sds-danger);
}

.sds-neumorphic-interactive {
  transition: color var(--sds-motion-fast) var(--sds-ease-standard), box-shadow var(--sds-motion-fast) var(--sds-ease-standard), transform var(--sds-motion-fast) var(--sds-ease-standard);
}

.sds-neumorphic-interactive:hover {
  box-shadow: var(--sds-shadow-raised);
  transform: translateY(-1px);
}

.sds-neumorphic-interactive:focus-visible {
  box-shadow: var(--sds-shadow-focus), var(--sds-neu-shadow-card);
}

.sds-disclosure-shadow > .sds-action,
.sds-disclosure-shadow > .sds-action:hover {
  background: transparent;
  color: inherit;
}

:is(.sds-sales-dashboard-scope, .sds-neumorphic-workflow-scope) .sds-workspace-surface,
:is(.sds-sales-dashboard-scope, .sds-neumorphic-workflow-scope) .sds-card {
  border-color: var(--sds-border-subtle);
  background: var(--sds-surface-raised);
  box-shadow: var(--sds-neu-shadow-card);
}

:is(.sds-sales-dashboard-scope, .sds-neumorphic-workflow-scope) .sds-field {
  border-color: var(--sds-border-subtle);
  background: var(--sds-surface-subtle);
  box-shadow: var(--sds-neu-shadow-inset);
}

:is(.sds-sales-dashboard-scope, .sds-neumorphic-workflow-scope) .sds-action-outline,
:is(.sds-sales-dashboard-scope, .sds-neumorphic-workflow-scope) .sds-action-ghost {
  box-shadow: var(--sds-neu-shadow-small);
}

:is(.sds-sales-dashboard-scope, .sds-neumorphic-workflow-scope) .sds-action:active {
  box-shadow: var(--sds-neu-shadow-inset);
}

.sds-action.sds-hiring-phase-completed {
  border-color: color-mix(in srgb, var(--sds-success) 58%, var(--sds-border-default));
  background: color-mix(in srgb, var(--sds-success) 18%, var(--sds-surface-raised));
  color: color-mix(in srgb, var(--sds-success) 82%, var(--sds-text-primary));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sds-success) 14%, transparent);
}

[data-theme="dark"] .sds-action.sds-hiring-phase-completed {
  background: color-mix(in srgb, var(--sds-success) 24%, var(--sds-surface-raised));
  color: var(--sds-text-primary);
}

.sds-dashboard-sidebar {
  border-left: 1px solid var(--sds-border-subtle);
  background: var(--sds-surface-canvas);
  color: var(--sds-text-primary);
  box-shadow: -10px 0 28px rgb(28 45 58 / 9%);
}

[data-theme="dark"] .sds-dashboard-sidebar {
  box-shadow: -12px 0 30px rgb(0 0 0 / 28%);
}

.sds-dashboard-sidebar-header,
.sds-dashboard-sidebar-footer {
  border-color: var(--sds-border-subtle);
}

.sds-dashboard-sidebar-header {
  border-bottom: 1px solid var(--sds-border-subtle);
}

.sds-dashboard-sidebar-footer {
  border-top: 1px solid var(--sds-border-subtle);
}

@media (min-width: 1024px) {
  .sds-dashboard-sidebar-footer-collapsed > .sds-dashboard-footer-action {
    flex: 0 0 3rem;
    width: 3rem;
    height: 3rem;
    padding: 0;
    align-self: center;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
  }
}

.sds-dashboard-brand {
  border: 1px solid var(--sds-border-subtle);
  background: var(--sds-surface-raised);
  box-shadow: var(--sds-neu-shadow-small);
}

.sds-dashboard-rail {
  border: 1px solid var(--sds-border-subtle);
  border-radius: 1.25rem;
  background: var(--sds-surface-panel);
  box-shadow: var(--sds-neu-shadow-card);
}

@media (min-width: 1024px) {
  .sds-dashboard-rail-collapsed {
    background: transparent;
  }
}

.sds-dashboard-nav-icon {
  display: inline-flex;
  width: 2.25rem;
  height: 2.25rem;
  flex: 0 0 2.25rem;
  align-items: center;
  justify-content: center;
  border-radius: 0.75rem;
}

.sds-dashboard-nav-active {
  box-shadow: var(--sds-neu-shadow-small);
}

.sds-dashboard-nav-active .sds-dashboard-nav-icon {
  background: color-mix(in srgb, var(--sds-accent) 12%, var(--sds-surface-raised));
  box-shadow: var(--sds-neu-shadow-small);
}

.sds-dashboard-footer-action {
  box-shadow: var(--sds-neu-shadow-small);
}

.sds-dashboard-sidebar .sds-action.sds-dashboard-sidebar-toggle {
  border-radius: 0.75rem 0 0 0.75rem;
  border-color: transparent;
  background: var(--sds-surface-panel);
  box-shadow: none;
}

.sds-dashboard-sidebar .sds-action.sds-dashboard-sidebar-toggle:hover {
  border-color: transparent;
  background: var(--sds-surface-panel);
  color: var(--sds-text-primary);
  box-shadow: none;
}

.sds-dashboard-sidebar [aria-label="ناوبری فضای کاری"] > div > div {
  border-color: transparent;
  border-radius: 0.9rem;
}

.sds-dashboard-sidebar [aria-label="ناوبری فضای کاری"] > div > div:hover {
  background: var(--sds-surface-raised);
  box-shadow: var(--sds-neu-shadow-small);
}

.sds-dashboard-sidebar [aria-current="page"] {
  color: var(--sds-accent);
}

.sds-dashboard-sidebar .sds-dashboard-nav-control:hover {
  color: var(--sds-text-primary);
}

.sds-dashboard-sidebar .sds-dashboard-nav-control[aria-current="page"],
.sds-dashboard-sidebar .sds-dashboard-nav-control[aria-current="page"]:hover {
  color: var(--sds-accent);
}

.sds-dashboard-topbar {
  border-bottom: 1px solid var(--sds-border-subtle);
  background: color-mix(in srgb, var(--sds-surface-raised) 92%, transparent);
  color: var(--sds-text-primary);
  box-shadow: 0 5px 18px rgb(30 48 62 / 5%);
  backdrop-filter: blur(18px);
}

[data-theme="dark"] .sds-dashboard-topbar {
  box-shadow: 0 6px 20px rgb(0 0 0 / 18%);
}

.dashboard-workspace-detail .sds-workspace > .sds-card,
.dashboard-workspace-detail .sds-workspace .sds-card {
  border-color: var(--sds-border-subtle);
  border-radius: var(--sds-radius-card);
  background: var(--sds-surface-raised);
  box-shadow: var(--sds-neu-shadow-card);
}

.dashboard-workspace-detail .sds-workspace .sds-field {
  background: var(--sds-surface-panel);
  box-shadow: var(--sds-neu-shadow-inset);
}

.dashboard-workspace-detail .sds-workspace .sds-action {
  border-radius: 0.875rem;
}

.guard-workspace .sds-card {
  border-color: var(--sds-border-subtle);
  background: var(--sds-surface-raised);
  box-shadow: var(--sds-neu-shadow-card);
}

.guard-workspace .sds-field {
  background: var(--sds-surface-panel);
  box-shadow: var(--sds-neu-shadow-inset);
}

.guard-workspace .sds-action {
  border-radius: 0.875rem;
}

.guard-workspace :where(.sds-card, .sds-neumorphic-card) {
  scroll-margin-top: 5.5rem;
}

@media (max-width: 1023px) {
  .sds-dashboard-sidebar {
    border-radius: 1.5rem 0 0 1.5rem;
    box-shadow: -18px 0 42px rgb(0 0 0 / 22%);
  }

  .sds-dashboard-rail {
    margin: 0.75rem;
  }
}

@media (min-width: 1024px) {
  .sds-dashboard-sidebar,
  [data-theme="dark"] .sds-dashboard-sidebar {
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

}

.sds-neumorphic-applicant-card {
  border: 1px solid var(--sds-border-subtle);
  border-radius: var(--sds-radius-card);
  background: var(--sds-surface-raised);
  box-shadow: var(--sds-neu-shadow-card, var(--sds-shadow-card));
}

.sds-neumorphic-applicant-shell {
  --sds-neu-shadow-card: 8px 8px 18px rgb(163 177 190 / 18%), -8px -8px 18px rgb(255 255 255 / 82%);
  min-height: 100vh;
  background: #f4f7f8;
}

[data-theme="dark"] .sds-neumorphic-applicant-shell {
  --sds-neu-shadow-card: 8px 8px 18px rgb(0 0 0 / 24%), -6px -6px 16px rgb(255 255 255 / 2.5%);
  background: #101923;
}

.sds-neumorphic-applicant-card .sds-field {
  box-shadow: var(--sds-neu-shadow-inset, inset 1px 1px 3px rgb(8 20 20 / 8%));
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --sds-motion-fast: 0ms;
    --sds-motion-standard: 0ms;
    --sds-motion-slow: 0ms;
  }
}

:where(button, a, input, select, textarea):focus-visible {
  outline: 2px solid var(--sds-focus-ring);
  outline-offset: 2px;
}

.sds-workspace {
  color: var(--sds-text-primary);
}

.sds-workspace-surface,
.sds-card {
    border: 1px solid var(--sds-border-default);
    border-radius: var(--sds-radius-card);
    background: var(--sds-surface-panel);
    color: var(--sds-text-primary);
    box-shadow: var(--sds-shadow-card);
}

.sds-card-interactive {
    transition:
      border-color var(--sds-motion-fast) var(--sds-ease-standard),
      box-shadow var(--sds-motion-fast) var(--sds-ease-standard),
      transform var(--sds-motion-fast) var(--sds-ease-standard);
}

.sds-card-interactive:hover {
    border-color: var(--sds-border-strong);
    box-shadow: var(--sds-shadow-raised);
    transform: translateY(-1px);
}

.sds-action {
    min-height: var(--sds-control-height);
    border: 1px solid transparent;
    border-radius: var(--sds-radius-control);
    transition:
      background-color var(--sds-motion-fast) var(--sds-ease-standard),
      border-color var(--sds-motion-fast) var(--sds-ease-standard),
      color var(--sds-motion-fast) var(--sds-ease-standard);
}

.sds-action-solid {
    border-color: var(--sds-tone-fg, var(--sds-accent));
    background: var(--sds-tone-fg, var(--sds-accent));
    color: var(--sds-text-inverse);
}

.sds-action-solid:hover {
    filter: brightness(0.94);
}

.sds-action-soft {
    border-color: var(--sds-tone-border, var(--sds-border-default));
    background: var(--sds-tone-surface, var(--sds-surface-subtle));
    color: var(--sds-tone-fg, var(--sds-text-secondary));
}

.sds-action-soft:hover {
    border-color: var(--sds-tone-fg, var(--sds-border-strong));
}

.sds-action-outline {
    border-color: var(--sds-tone-border, var(--sds-border-default));
    background: var(--sds-surface-panel);
    color: var(--sds-tone-fg, var(--sds-text-secondary));
}

.sds-action-outline:hover,
.sds-action-ghost:hover {
    background: var(--sds-tone-surface, var(--sds-accent-soft));
    color: var(--sds-tone-fg, var(--sds-accent-on-soft));
}

.sds-action-ghost {
    background: transparent;
    color: var(--sds-tone-fg, var(--sds-text-secondary));
}

.sds-tone-primary {
    --sds-tone-fg: var(--sds-accent);
    --sds-tone-surface: var(--sds-accent-soft);
    --sds-tone-border: color-mix(in srgb, var(--sds-accent) 36%, transparent);
}

.sds-tone-neutral {
    --sds-tone-fg: var(--sds-text-secondary);
    --sds-tone-surface: var(--sds-surface-subtle);
    --sds-tone-border: var(--sds-border-default);
}

.sds-tone-success {
    --sds-tone-fg: var(--sds-success);
    --sds-tone-surface: var(--sds-success-surface);
    --sds-tone-border: var(--sds-success-border);
}

.sds-tone-warning {
    --sds-tone-fg: var(--sds-warning);
    --sds-tone-surface: var(--sds-warning-surface);
    --sds-tone-border: var(--sds-warning-border);
}

.sds-tone-danger {
    --sds-tone-fg: var(--sds-danger);
    --sds-tone-surface: var(--sds-danger-surface);
    --sds-tone-border: var(--sds-danger-border);
}

.sds-tone-info {
    --sds-tone-fg: var(--sds-info);
    --sds-tone-surface: var(--sds-info-surface);
    --sds-tone-border: var(--sds-info-border);
}

.sds-tone-purple {
    --sds-tone-fg: var(--sds-purple);
    --sds-tone-surface: var(--sds-purple-surface);
    --sds-tone-border: var(--sds-purple-border);
}

.sds-tone-surface {
    border-color: var(--sds-tone-border);
    background: var(--sds-tone-surface);
    color: var(--sds-tone-fg);
}

.sds-field {
    min-height: var(--sds-control-height);
    border: 1px solid var(--sds-border-default);
    border-radius: var(--sds-radius-control);
    background: var(--sds-surface-panel);
    color: var(--sds-text-primary);
}

.sds-field::placeholder {
    color: var(--sds-text-secondary);
    opacity: 1;
}

.sds-text-primary {
    color: var(--sds-text-primary);
}

.sds-text-secondary {
    color: var(--sds-text-secondary);
}

.sds-text-muted {
    color: var(--sds-text-muted);
}

.sds-divider {
    border-color: var(--sds-border-subtle);
}

.sds-skeleton {
  background: var(--sds-surface-subtle);
}

@media (prefers-reduced-motion: reduce) {
  .sds-card-interactive:hover {
    transform: none;
  }

  .sds-neumorphic-interactive:hover {
    transform: none;
  }
}

/* Dialogs use the existing navy workspace palette, with quiet boundaries. */
[data-theme="dark"] [role=dialog],
[data-theme="dark"][role=dialog],
[data-theme="dark"] [role=dialog] [data-erp-overlay-root] {
  --sds-surface-canvas: #101923;
  --sds-surface-panel: #15212c;
  --sds-surface-subtle: #111d27;
  --sds-surface-raised: #182631;
  --sds-border-subtle: rgb(255 255 255 / 5%);
  --sds-border-default: rgb(255 255 255 / 8%);
  --sds-border-strong: rgb(255 255 255 / 13%);
  --sds-accent-soft: #203b47;
  --sds-accent-on-soft: #b2dedc;
}

/* Keep unit choices readable without adding frames to every control. */
[role=dialog] .sds-unit-switch { gap: 0.25rem; }
[role=dialog] .sds-unit-switch [role=radio] { min-width: 3rem; font-size: 0.875rem; }
[data-theme="dark"] [role=dialog] [role=radio][aria-checked=true] {
  border-color: transparent;
  background: var(--sds-accent-soft);
  color: var(--sds-accent-on-soft);
}
